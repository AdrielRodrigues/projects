<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Index</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    nav { margin: 1rem 0; }
    ul { padding-left: 1.2rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Index</h1>
  <nav id="crumbs"></nav>
  <ul id="list"></ul>
  <p id="status"></p>

  <script>
    // Repo to list. On GitHub Pages (<owner>.github.io/<repo>/) this is detected; otherwise the fallback is used.
    const FALLBACK = { owner: 'AdrielRodrigues', repo: 'projects' };
    const ROOTS = ['projects', 'saves'];  // top-level folders shown at the start

    const host = location.hostname.match(/^(.+)\.github\.io$/);
    const OWNER = host ? host[1] : FALLBACK.owner;
    const REPO = host ? (location.pathname.split('/')[1] || FALLBACK.repo) : FALLBACK.repo;

    const $ = id => document.getElementById(id);
    const encodePath = p => p.split('/').map(encodeURIComponent).join('/');

    async function listDir(path) {
      const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${encodePath(path)}`);
      if (res.status === 403 || res.status === 429) throw new Error('GitHub API rate limit reached, try again later');
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      const items = await res.json();
      return items.sort((a, b) => (a.type === 'dir') !== (b.type === 'dir') ? (a.type === 'dir' ? -1 : 1) : a.name.localeCompare(b.name));
    }

    function renderCrumbs(path) {
      const nav = $('crumbs');
      nav.replaceChildren();
      const parts = path ? path.split('/') : [];
      const add = (label, target) => {
        if (nav.childNodes.length) nav.append(' / ');
        if (target === null) { nav.append(label); return; }
        const a = document.createElement('a');
        a.href = '#' + target;
        a.textContent = label;
        nav.append(a);
      };
      add('home', parts.length ? '' : null);
      parts.forEach((part, i) => add(part, i === parts.length - 1 ? null : parts.slice(0, i + 1).join('/')));
    }

    function addItem(label, href) {
      const li = document.createElement('li');
      const a = document.createElement('a');
      a.href = href;
      a.textContent = label;
      li.append(a);
      $('list').append(li);
    }

    async function render() {
      const path = decodeURIComponent(location.hash.slice(1)).replace(/^\/+|\/+$/g, '');
      renderCrumbs(path);
      $('list').replaceChildren();
      $('status').className = '';
      $('status').textContent = '';

      if (!path) {
        ROOTS.forEach(r => addItem(r + '/', '#' + encodeURIComponent(r)));
        return;
      }
      $('status').textContent = 'Loading...';
      try {
        const items = await listDir(path);
        $('status').textContent = items.length ? '' : 'Empty.';
        for (const item of items) {
          if (item.type === 'dir') addItem(item.name + '/', '#' + encodePath(item.path));
          else addItem(item.name, encodePath(item.path));  // relative link, served by Pages
        }
      } catch (err) {
        $('status').className = 'error';
        $('status').textContent = `Could not list "${path}": ${err.message}`;
      }
    }

    addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
